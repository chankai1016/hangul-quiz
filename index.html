<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101720">
<meta name="description" content="Hangul jamo quiz — ハングル字母テスト / 韓文字母測驗 / Hangul Letter Quiz. 113 questions, three languages, audio.">
<title>ハングル字母テスト — 한글 자모 테스트</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><b>한글</b> 자모 테스트</div>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="ja" aria-pressed="true" lang="ja">日本語</button>
      <button type="button" data-lang="zh" aria-pressed="false" lang="zh-Hant">繁體</button>
      <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
    </div>
  </header>

  <!-- ============ SETUP ============ -->
  <section class="panel" id="setup">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1><span id="titleText"></span><span class="sub" id="subtitleText"></span></h1>
    <p class="lede" id="ledeText"></p>

    <div class="rule"></div>

    <div class="field-label"><b id="rangeLabel"></b><small id="poolcount"></small></div>
    <div class="chips" id="cats"></div>

    <div class="spacer"></div>
    <div class="field-label"><b id="countLabel"></b><small id="countNote"></small></div>
    <div class="segs" id="segs">
      <button class="seg" type="button" data-n="10" aria-pressed="true">10</button>
      <button class="seg" type="button" data-n="20" aria-pressed="false">20</button>
      <button class="seg" type="button" data-n="40" aria-pressed="false">40</button>
      <button class="seg" type="button" data-n="0" aria-pressed="false" id="segAll"></button>
    </div>

    <div class="rule"></div>

    <!-- 音声設定 -->
    <p class="eyebrow" id="audioEyebrow"></p>

    <div class="field-label"><b id="genderLabel"></b><small id="genderNote"></small></div>
    <div class="segs" id="genders">
      <button class="seg" type="button" data-gender="auto" aria-pressed="true" id="segAuto"></button>
      <button class="seg" type="button" data-gender="female" aria-pressed="false" id="segFemale"></button>
      <button class="seg" type="button" data-gender="male" aria-pressed="false" id="segMale"></button>
    </div>

    <div class="spacer-sm"></div>
    <div class="field-label"><b id="voiceLabel"></b><small id="voiceCount"></small></div>
    <select id="voiceSelect" class="select"></select>

    <div class="spacer-sm"></div>
    <div class="field-label"><b id="modeLabel"></b><small id="modeNote"></small></div>
    <div class="segs" id="modes">
      <button class="seg" type="button" data-mode="seq" aria-pressed="true" id="segSeq"></button>
      <button class="seg" type="button" data-mode="one" aria-pressed="false" id="segOne"></button>
    </div>

    <label class="check" id="autoWrap">
      <input type="checkbox" id="autoPlay" checked>
      <span id="autoLabel"></span>
    </label>

    <button class="ghost-test" type="button" id="testVoice"></button>
    <p class="tswarn hidden" id="tswarn"></p>

    <button class="start" type="button" id="start"></button>

    <div class="statline">
      <span id="lifetime"></span>
      <button type="button" id="resetstats"></button>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section class="panel hidden" id="quiz">
    <div class="progress"><i id="pbar"></i></div>
    <div class="qmeta">
      <span class="qn">Q <b id="qnum">1</b> / <b id="qtotal">10</b></span>
      <span id="qcat"></span>
      <span class="tally" id="tally">✓ 0</span>
    </div>

    <div class="stage">
      <div class="stamp" id="stamp"></div>
      <div class="glyph" id="glyph">가</div>
      <div class="hint" id="hint"></div>
    </div>

    <button class="listenall" type="button" id="listenall">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-7.5v2.1a6.8 6.8 0 0 1 0 10.8v2.1a8.9 8.9 0 0 0 0-15z"/></svg>
      <span id="listenAllLabel"></span>
    </button>

    <div class="opts" id="opts"></div>

    <button class="confirm" type="button" id="confirm" disabled></button>

    <div class="feedback hidden" id="feedback">
      <div class="verdict" id="verdict"></div>
      <div class="spec" id="spec"></div>
      <p class="note hidden" id="note"></p>
      <div class="audio">
        <button type="button" data-rate="0.85">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zm-2.5-7.5v2.1a6.8 6.8 0 0 1 0 10.8v2.1a8.9 8.9 0 0 0 0-15z"/></svg>
          <span id="listenLabel"></span>
        </button>
        <button type="button" data-rate="0.45">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm13 3a5 5 0 0 0-2-4v8a5 5 0 0 0 2-4z"/></svg>
          <span id="slowLabel"></span>
        </button>
      </div>
      <p class="tswarn hidden" id="tswarn2"></p>
      <button class="next" type="button" id="next"></button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section class="panel hidden" id="result">
    <p class="eyebrow" id="resultEyebrow"></p>
    <div class="score"><b id="rscore">0</b><small id="rtotal">/ 10</small></div>
    <p class="grade" id="rgrade"></p>

    <div class="missed" id="missedbox">
      <h2 id="missedTitle"></h2>
      <div id="missedlist"></div>
    </div>

    <div class="actions">
      <button class="primary" type="button" id="again"></button>
      <button class="ghost" type="button" id="review"></button>
      <button class="ghost" type="button" id="tosetup"></button>
    </div>
  </section>

  <p class="foot"><span id="foot1"></span><br><b id="foot2"></b></p>
</div>

<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
